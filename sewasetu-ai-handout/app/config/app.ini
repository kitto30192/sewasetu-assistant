; Sewa Setu configuration
; Consolidated from config/settings.ini, March 2026 (CR-2026-031)

[database]
host = db
port = 5432
name = sewasetu
user = sewasetu
; password is injected via DB_PASSWORD (docker-compose maps POSTGRES_PASSWORD to it)
password =

[app]
; secret_key is injected via SECRET_KEY env var
secret_key =
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
