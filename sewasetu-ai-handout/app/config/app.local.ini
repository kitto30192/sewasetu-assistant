; Sewa Setu configuration — local development (no Docker)
; Overrides for running directly on Windows

[database]
host = localhost
port = 5432
name = sewasetu
user = sewasetu
; local-only (SQLite is used when SEWASETU_LOCAL=1)
password = local-dev-only

[app]
; local-only placeholder — not a production secret
secret_key = local-dev-only
sms_gateway_url = http://localhost:8025
otp_validity_seconds = 300
upload_dir = ./uploads

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
